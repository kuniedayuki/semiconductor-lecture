<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半導体サプライチェーン 全体マップ ── インタラクティブ教材</title>
<style>
  :root{
    --bg:#070b12; --panel:#121a2b; --panel2:#15233c; --line:#27314c; --txt:#eaf0fb;
    --sub:#9fb0d0; --dim:#5f6f8f; --accent:#4ea1ff; --gold:#f4c542; --green:#39d98a;
    --red:#ff6b6b; --purple:#b58bff; --orange:#ff9f6b; --teal:#5fe0cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;overflow:hidden}
  a{color:var(--accent)}

  /* ---- top bar ---- */
  #top{position:fixed;top:0;left:0;right:0;height:60px;z-index:30;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:linear-gradient(180deg,rgba(10,16,28,.96),rgba(10,16,28,.72));
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  #top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.02em;white-space:nowrap}
  #top h1 .hl{color:var(--gold)}
  #top .spacer{flex:1}
  #search{background:#0e1726;border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:8px 12px;font-size:13px;width:210px;outline:none}
  #search:focus{border-color:var(--accent)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .tipbar{font-size:12px;color:var(--dim);white-space:nowrap}

  /* ---- map viewport ---- */
  #viewport{position:fixed;inset:60px 0 0 0;overflow:hidden;cursor:grab;
    background:radial-gradient(130% 120% at 50% 0%,#0c1322,#05080f);touch-action:none}
  #viewport.grabbing{cursor:grabbing}
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #canvas svg{display:block}

  .node{cursor:pointer}
  .node .card{transition:filter .15s, transform .15s}
  .node:hover .card{filter:brightness(1.35) drop-shadow(0 0 10px rgba(78,161,255,.5))}
  .node.dim{opacity:.18}
  .node.match .card{filter:brightness(1.5) drop-shadow(0 0 14px rgba(244,197,66,.7))}

  /* ---- zoom controls ---- */
  #zoomctl{position:fixed;right:18px;bottom:22px;z-index:30;display:flex;flex-direction:column;gap:8px}
  #zoomctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
    background:#101a2b;color:var(--txt);font-size:20px;cursor:pointer;display:grid;place-items:center}
  #zoomctl button:hover{border-color:var(--accent);background:#16233a}
  #zoomctl .small{font-size:11px;height:34px;line-height:1}

  /* ---- detail overlay ---- */
  #detail{position:fixed;inset:0;z-index:40;overflow-y:auto;display:none;
    background:linear-gradient(180deg,#070b12,#0a1120)}
  #detail.show{display:block}
  .d-wrap{max-width:1080px;margin:0 auto;padding:30px 22px 80px}
  .d-back{position:sticky;top:0;z-index:2;display:inline-flex;align-items:center;gap:8px;margin:6px 0 18px;
    background:#101a2b;border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:10px 16px;cursor:pointer;font-size:14px;font-weight:700}
  .d-back:hover{border-color:var(--accent)}
  .d-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px}
  .d-flag{font-size:46px;line-height:1}
  .d-htext{flex:1;min-width:240px}
  .d-name{font-size:30px;font-weight:800;margin:0 0 4px}
  .d-name .code{font-size:16px;color:var(--dim);font-weight:700;margin-left:10px;font-variant-numeric:tabular-nums}
  .d-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .d-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
  .d-tag.stage{color:#071018}
  .d-catch{font-size:18px;color:var(--gold);font-weight:700;margin:14px 0 0;line-height:1.5}

  .sec{margin-top:26px}
  .sec h3{font-size:14px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;
    margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .sec h3 .ic{font-size:16px}
  .sec p{margin:0;line-height:1.75;color:#dbe5f5;font-size:15px}

  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .pillar{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
  .pillar .pn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#071018;
    font-weight:800;display:grid;place-items:center;font-size:14px;margin-bottom:10px}
  .pillar .pt{font-weight:800;font-size:14px;margin-bottom:6px}
  .pillar .pd{font-size:13px;color:var(--sub);line-height:1.6}

  .sharebox{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--green);
    border-radius:10px;padding:16px 18px;line-height:1.75;font-size:15px}

  .rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .rival{background:#1a1410;border:1px solid #4a3a1a;border-left:4px solid var(--gold);
    border-radius:10px;padding:13px 15px}
  .rival .rn{font-weight:800;font-size:14px;margin-bottom:4px}
  .rival .rn .rf{margin-left:6px;font-size:13px}
  .rival .rd{font-size:13px;color:var(--sub);line-height:1.55}

  .valgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .valcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .valcard .vk{font-size:12px;color:var(--sub);margin-bottom:6px}
  .valcard .vv{font-size:20px;font-weight:800}
  .valnote{font-size:12px;color:var(--dim);margin-top:10px}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .colbox{border-radius:12px;padding:16px}
  .colbox.good{background:#10241a;border:1px solid #2c6b4e}
  .colbox.bad{background:#241010;border:1px solid #6b2c2c}
  .colbox h4{margin:0 0 10px;font-size:14px;font-weight:800}
  .colbox.good h4{color:var(--green)}
  .colbox.bad h4{color:var(--red)}
  .colbox ul{margin:0;padding-left:18px}
  .colbox li{font-size:13.5px;line-height:1.7;color:#dbe5f5;margin-bottom:5px}

  .termbox{background:#101a2b;border:1px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7}
  .termbox b{color:var(--accent)}

  .d-links{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
  .d-links a{display:inline-flex;align-items:center;gap:8px;background:#101a2b;border:1px solid var(--line);
    border-radius:10px;padding:11px 18px;text-decoration:none;color:var(--txt);font-weight:700;font-size:14px}
  .d-links a:hover{border-color:var(--accent)}
  .disclaimer{margin-top:28px;font-size:12px;color:var(--dim);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}

  @media (max-width:720px){
    #top h1{font-size:14px}
    .legend,.tipbar{display:none}
    #search{width:130px}
    .pillars{grid-template-columns:1fr}
    .cols2{grid-template-columns:1fr}
    .d-name{font-size:24px}
  }
</style>
</head>
<body>

<div id="top">
  <h1>半導体サプライチェーン <span class="hl">全体マップ</span></h1>
  <div class="legend">

<div id="viewport">

</div>

<div id="zoomctl">

  <button id="zout" title="縮小">－</button>

</div>

<div id="detail"><div class="d-wrap" id="dbody"></div></div>

/* ====================== マップ生成 ====================== */
var NS="http://www.w3.org/2000/svg";
var byCode={}; C.forEach(function(x){ byCode[x.code]=x; });

var COLW=380, COLGAP=42, X0=56, HEADY=58, HEADH=86, CARDY=176, CARDH=66, CARDGAP=15, PAD=18, INGAP=14;
var canvasW=0, canvasH=0;

function buildMap(){
  var svgNS=document.createElementNS(NS,"svg");
  // pre-calc stage layouts
  var layouts=STAGES.map(function(st,si){
    var list=C.filter(function(x){return x.stage===st.id;});
    var cols=list.length>=10?2:1;
    var usableW=COLW-2*PAD;
    var cardW=cols===2?(usableW-INGAP)/2:usableW;
    var rows=Math.ceil(list.length/cols);
    var x=X0+si*(COLW+COLGAP);
    var zoneH=(CARDY-HEADY)+rows*(CARDH+CARDGAP)+PAD;
    return {st:st,list:list,cols:cols,cardW:cardW,rows:rows,x:x,zoneH:zoneH};
  });
  canvasW=X0+STAGES.length*COLW+(STAGES.length-1)*COLGAP+X0;
  canvasH=Math.max.apply(null,layouts.map(function(l){return HEADY+l.zoneH;}))+70;

  svgNS.setAttribute("width",canvasW);
  svgNS.setAttribute("height",canvasH);
  svgNS.setAttribute("viewBox","0 0 "+canvasW+" "+canvasH);

  // defs
  var defs=document.createElementNS(NS,"defs");
  defs.innerHTML='<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/></filter>'+
    '<marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M2,2 L9,6 L2,10" fill="none" stroke="#3a4a72" stroke-width="2"/></marker>';
  svgNS.appendChild(defs);

  // background flow band (fab->osat->comp->sys)
  var fabL=layouts[3], sysL=layouts[6];
  var flowY=canvasH-34;
  var band=document.createElementNS(NS,"path");
  band.setAttribute("d","M "+(fabL.x)+" "+flowY+" H "+(sysL.x+COLW));
  band.setAttribute("stroke","#1a2740"); band.setAttribute("stroke-width","20"); band.setAttribute("fill","none");
  band.setAttribute("stroke-linecap","round");
  svgNS.appendChild(band);
  var bandlabel=mkText((fabL.x+sysL.x+COLW)/2, flowY+4, "製品の流れ ▶ 製造 → 後工程 → 部品実装 → システム", 13, "#6b7da0","middle");
  bandlabel.setAttribute("font-weight","700"); svgNS.appendChild(bandlabel);

  // inputs bracket over design/equip/material -> fab
  var inL=layouts[0], in3=layouts[2];
  var brBottom=canvasH-58;
  [layouts[0],layouts[1],layouts[2]].forEach(function(l){
    var a=document.createElementNS(NS,"path");
    var sx=l.x+COLW/2, sy=brBottom, ex=fabL.x+COLW/2, ey=flowY-16;
    a.setAttribute("d","M "+sx+" "+sy+" C "+sx+" "+(sy+30)+" "+ex+" "+(ey-30)+" "+ex+" "+ey);
    a.setAttribute("stroke","#23304d"); a.setAttribute("stroke-width","2.5"); a.setAttribute("fill","none");
    a.setAttribute("stroke-dasharray","2 6"); a.setAttribute("opacity","0.7");
    svgNS.appendChild(a);
  });
  var inLabel=mkText((inL.x+in3.x+COLW)/2, 28, "◀ 製造を支える3要素（設計・装置・材料が ④ に集まる）", 13, "#6b7da0","middle");
  inLabel.setAttribute("font-weight","700"); svgNS.appendChild(inLabel);

  // stages
  layouts.forEach(function(l){
    var st=l.st;
    // zone
    var zone=document.createElementNS(NS,"rect");
    zone.setAttribute("x",l.x); zone.setAttribute("y",HEADY); zone.setAttribute("width",COLW);
    zone.setAttribute("height",l.zoneH); zone.setAttribute("rx",18);
    zone.setAttribute("fill","rgba(18,26,43,0.55)"); zone.setAttribute("stroke",st.c);
    zone.setAttribute("stroke-opacity","0.35"); zone.setAttribute("stroke-width","1.5");
    svgNS.appendChild(zone);
    // header
    var hbar=document.createElementNS(NS,"rect");
    hbar.setAttribute("x",l.x); hbar.setAttribute("y",HEADY); hbar.setAttribute("width",COLW);
    hbar.setAttribute("height",HEADH); hbar.setAttribute("rx",18);
    hbar.setAttribute("fill",st.c); hbar.setAttribute("fill-opacity","0.14");
    svgNS.appendChild(hbar);
    var stripe=document.createElementNS(NS,"rect");
    stripe.setAttribute("x",l.x); stripe.setAttribute("y",HEADY); stripe.setAttribute("width",6);
    stripe.setAttribute("height",HEADH); stripe.setAttribute("fill",st.c); svgNS.appendChild(stripe);
    var t1=mkText(l.x+20,HEADY+36,st.t,20,"#eaf0fb","start"); t1.setAttribute("font-weight","800"); svgNS.appendChild(t1);
    var t2=mkText(l.x+20,HEADY+62,st.s,13,"#9fb0d0","start"); svgNS.appendChild(t2);
    var cnt=mkText(l.x+COLW-16,HEADY+36,l.list.length+"社",13,st.c,"end"); cnt.setAttribute("font-weight","800"); svgNS.appendChild(cnt);

    // cards
    l.list.forEach(function(co,k){
      var col=k%l.cols, row=Math.floor(k/l.cols);
      var cx=l.x+PAD+col*(l.cardW+INGAP);
      var cy=CARDY+row*(CARDH+CARDGAP);
      var g=document.createElementNS(NS,"g");
      g.setAttribute("class","node"); g.setAttribute("data-code",co.code); g.setAttribute("data-name",co.name);
      var col0=co.jp?"#4ea1ff":"#f4c542";
      var two=l.cols===2;
      var nameMax=two?9:18, roleMax=two?15:30, nameSize=two?14:15;
      var inner='<rect class="card" x="'+cx+'" y="'+cy+'" width="'+l.cardW+'" height="'+CARDH+'" rx="11" fill="#15233c" stroke="'+col0+'" stroke-opacity="0.55" stroke-width="1.5" filter="url(#soft)"/>'+
        '<rect x="'+cx+'" y="'+cy+'" width="5" height="'+CARDH+'" rx="2.5" fill="'+col0+'"/>'+
        '<text x="'+(cx+15)+'" y="'+(cy+25)+'" fill="#eaf0fb" font-size="'+nameSize+'" font-weight="800">'+co.flag+' '+esc(clip(co.name,nameMax))+'</text>'+
        '<text x="'+(cx+15)+'" y="'+(cy+46)+'" fill="#9fb0d0" font-size="11.5">'+esc(clip(co.q,roleMax))+'</text>'+
        '<text x="'+(cx+l.cardW-11)+'" y="'+(cy+46)+'" fill="'+col0+'" font-size="10" font-weight="700" text-anchor="end">'+esc(co.code)+' ›</text>';
      g.innerHTML=inner;
      svgNS.appendChild(g);
    });
  });

  var cv=document.getElementById("canvas");
  cv.innerHTML=""; cv.appendChild(svgNS);
  cv.style.width=canvasW+"px"; cv.style.height=canvasH+"px";
}
function mkText(x,y,str,size,fill,anchor){
  var t=document.createElementNS(NS,"text");
  t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("font-size",size);
  t.setAttribute("fill",fill); t.setAttribute("text-anchor",anchor||"start"); t.textContent=str; return t;
}
function esc(s){return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function clip(s,n){s=s||"";return s.length>n?s.slice(0,n-1)+"…":s;}

/* ====================== パン＆ズーム ====================== */
var vp=document.getElementById("viewport"), cv=document.getElementById("canvas");
var tx=0, ty=0, scale=1, MINS=0.25, MAXS=2.4;
function apply(){ cv.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")"; }
function fit(){
  var w=vp.clientWidth, h=vp.clientHeight;
  scale=Math.min(w/canvasW, h/canvasH)*0.97;
  scale=Math.max(MINS,Math.min(MAXS,scale));
  tx=(w-canvasW*scale)/2; ty=(h-canvasH*scale)/2+8; apply();
}
function zoomAt(cxp,cyp,factor){
  var ns=Math.max(MINS,Math.min(MAXS,scale*factor));
  var wx=(cxp-tx)/scale, wy=(cyp-ty)/scale;
  scale=ns; tx=cxp-wx*scale; ty=cyp-wy*scale; apply();
}
vp.addEventListener("wheel",function(e){
  e.preventDefault();
  var r=vp.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:1/1.12);
},{passive:false});

var dragging=false, sx0=0, sy0=0, moved=0, downT=0;
vp.addEventListener("pointerdown",function(e){
  dragging=true; moved=0; downT=Date.now(); sx0=e.clientX; sy0=e.clientY;
  vp.classList.add("grabbing"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove",function(e){
  if(!dragging)return;
  var dx=e.clientX-sx0, dy=e.clientY-sy0; moved+=Math.abs(dx)+Math.abs(dy);
  tx+=dx; ty+=dy; sx0=e.clientX; sy0=e.clientY; apply();
});
vp.addEventListener("pointerup",function(e){
  dragging=false; vp.classList.remove("grabbing");
  if(moved<6 && Date.now()-downT<400){
    var node=e.target.closest && e.target.closest(".node");
    if(node){ location.hash="#c/"+node.getAttribute("data-code"); }
  }
});
vp.addEventListener("pointercancel",function(){dragging=false;vp.classList.remove("grabbing");});

document.getElementById("zin").onclick=function(){ zoomAt(vp.clientWidth/2,vp.clientHeight/2,1.25); };
document.getElementById("zout").onclick=function(){ zoomAt(vp.clientWidth/2,vp.clientHeight/2,1/1.25); };
document.getElementById("zreset").onclick=fit;

/* ====================== 検索ハイライト ====================== */
document.getElementById("search").addEventListener("input",function(e){
  var q=e.target.value.trim().toLowerCase();
  var nodes=document.querySelectorAll(".node");
  nodes.forEach(function(n){
    n.classList.remove("match","dim");
    if(!q)return;
    var hay=(n.getAttribute("data-name")+" "+n.getAttribute("data-code")).toLowerCase();
    var co=byCode[n.getAttribute("data-code")];
    if(co){ hay+=" "+(co.q||"")+" "+(co.catch||""); }
    if(hay.indexOf(q)>=0){ n.classList.add("match"); } else { n.classList.add("dim"); }
  });
});

/* ====================== 詳細ページ ====================== */
function pillarHTML(p,i){
  return '<div class="pillar"><div class="pn">'+(i+1)+'</div><div class="pt">'+esc(p[0])+'</div><div class="pd">'+esc(p[1])+'</div></div>';
}
function rivalHTML(r){
  return '<div class="rival"><div class="rn">'+esc(r[0])+'<span class="rf">'+(r[1]||"")+'</span></div><div class="rd">'+esc(r[2]||"")+'</div></div>';
}
function liHTML(s){return '<li>'+esc(s)+'</li>';}
function renderDetail(code){
  var co=byCode[code]; if(!co){ location.hash=""; return; }
  var st=STAGES.filter(function(s){return s.id===co.stage;})[0]||{t:"",c:"#4ea1ff"};
  var h='';
  h+='<button class="d-back" onclick="location.hash=\'\'">‹ マップに戻る</button>';
  h+='<div class="d-head"><div class="d-flag">'+co.flag+'</div><div class="d-htext">'+
     '<div class="d-name">'+esc(co.name)+'<span class="code">'+esc(co.code)+'</span></div>'+
     '<div class="d-tags"><span class="d-tag stage" style="background:'+st.c+'">'+esc(st.t)+'</span>'+
     '<span class="d-tag">'+(co.jp?'日本企業':'海外企業')+'</span>'+
     '<span class="d-tag">'+esc(co.q)+'</span></div>'+
     '<div class="d-catch">「'+esc(co.catch)+'」</div></div></div>';

  h+='<div class="sec"><h3><span class="ic">🏭</span>事業内容</h3><p>'+esc(co.biz)+'</p></div>';

  h+='<div class="sec"><h3><span class="ic">💪</span>強みの源泉</h3><div class="pillars">'+
     co.pillars.map(pillarHTML).join("")+'</div></div>';

  h+='<div class="sec"><h3><span class="ic">🌐</span>世界シェア・ポジション</h3><div class="sharebox">'+esc(co.share)+'</div></div>';

  h+='<div class="sec"><h3><span class="ic">⚔️</span>海外の強い競合</h3><div class="rivals">'+
     co.rivals.map(rivalHTML).join("")+'</div></div>';

  h+='<div class="sec"><h3><span class="ic">💴</span>バリュエーション（参考）</h3><div class="sharebox" style="border-left-color:var(--gold)">'+esc(co.val)+'</div>'+
     '<div class="valnote">※株価・指標は記載時点の参考情報。投資判断はご自身で行ってください。最新値は要確認。</div></div>';

  h+='<div class="sec"><div class="cols2">'+
     '<div class="colbox good"><h4>✅ 投資ポイント</h4><ul>'+co.pts.map(liHTML).join("")+'</ul></div>'+
     '<div class="colbox bad"><h4>⚠ リスク</h4><ul>'+co.risks.map(liHTML).join("")+'</ul></div></div></div>';

  if(co.term){
    h+='<div class="sec"><h3><span class="ic">📘</span>ひとくち用語</h3><div class="termbox"><b>'+esc(co.term[0])+'</b> … '+esc(co.term[1])+'</div></div>';
  }

  h+='<div class="d-links"><a href="'+MOVIE+'" target="_blank">🎬 解説ムービーで見る</a>'+
     '<a href="javascript:location.hash=\'\'">🗺 全体マップに戻る</a></div>';

  h+='<div class="disclaimer">本ページは半導体サプライチェーンを学ぶための教材です。財務・株価データは記載時点の参考情報・概算を含み、正確性を保証するものではありません。投資はご自身の判断と責任で行ってください。</div>';

  document.getElementById("dbody").innerHTML=h;
}

/* ====================== ルーティング ====================== */
function route(){
  var hash=location.hash||"";
  var d=document.getElementById("detail");
  var m=hash.match(/^#c\/(.+)$/);
  if(m){ renderDetail(decodeURIComponent(m[1])); d.classList.add("show"); d.scrollTop=0; window.scrollTo(0,0); }
  else { d.classList.remove("show"); }
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",function(){ if(!location.hash) fit(); });

/* ====================== 起動 ====================== */
buildMap();
fit();
route();
try{ console.log("%c[map] supply-chain map v1 / "+C.length+" companies","color:#39d98a;font-weight:bold"); }catch(e){}
</script>
</body>
